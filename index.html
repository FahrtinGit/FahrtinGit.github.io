<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praksis IK START</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">
        <img src="images/ik-start-logo.png" alt="IK Start logo" class="brand-mark-img">
      </div>
      <div class="brand-text">
        <strong id="brand-name"></strong>
        <span id="brand-tagline"></span>
      </div>
    </div>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-brand">
      <strong id="footer-brand-name"></strong>
      <span id="footer-names"></span>
    </div>
    <div class="footer-note" id="footer-note"></div>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
